name: Cindy Bank7 offline converter
on:
  push:
    branches: [tools/cindy-bank7-offline-pack]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet publish tools/CindyBank7/CindyBank7.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o out
      - uses: actions/upload-artifact@v4
        with:
          name: CindyBank7-linux-x64
          path: out/
