name: Verify and Release Bank v1.5 Full Image

on:
  push:
    branches:
      - feature/bank-v15-full-image

permissions:
  contents: write

jobs:
  verify-and-release:
    if: startsWith(github.event.head_commit.message, 'release:')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run feature regression tests
        shell: pwsh
        run: dotnet test Tests/PKHeX.Core.Tests/PKHeX.Core.Tests.csproj -c Release --nologo --filter "FullyQualifiedName~ParseSettingsBulkStorageTests|FullyQualifiedName~BoxCloneUtilTests|FullyQualifiedName~Bank7V15|FullyQualifiedName~Bank7Metadata|FullyQualifiedName~Bank7BoxMetadata|FullyQualifiedName~Bank7RoundTrip|FullyQualifiedName~SaveUtilBank7"

      - name: Run Core tests excluding known master baseline failure
        shell: pwsh
        run: dotnet test Tests/PKHeX.Core.Tests/PKHeX.Core.Tests.csproj -c Release --nologo --filter "FullyQualifiedName!=PKHeX.Core.Tests.Legality.EffortExpLegalityTests.ZeroEVs_ReturnsZero"

      - name: Publish PKHeX Win-x64
        shell: pwsh
        run: dotnet publish PKHeX.WinForms/PKHeX.WinForms.csproj -c Release -r win-x64 -o publish --nologo

      - name: Package release
        shell: pwsh
        run: |
          $asset = 'PKHeX-Bank-v1.5-FullImage-MetadataViewer-r2-20260920-win-x64.zip'
          if (Test-Path $asset) { Remove-Item $asset -Force }
          Compress-Archive -Path publish\* -DestinationPath $asset -CompressionLevel Optimal

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'bank-v15-full-image-20260920-r2'
          $asset = 'PKHeX-Bank-v1.5-FullImage-MetadataViewer-r2-20260920-win-x64.zip'
          $notes = @'
          ## Metadata viewer r2
          - Makes the Pokémon Bank metadata entry explicit with a visible `Metadata` text button on the Box page for `0xBB518` full images.
          - Synchronizes visibility as soon as the edit environment receives a full Bank image.
          - Keeps the Metadata button aligned beneath Search after box centering and window resizing.
          - Boxes view now summarizes raw Gen 6/Gen 7 format tags, source-code distributions, and latest metadata timestamp.
          - Slots view now shows interpreted format, source title, decoded UTC metadata time, and the original raw timestamp together.
          - Source codes use the Bank mapping for X/Y/OR/AS/Sun/Moon/Ultra Sun/Ultra Moon; unknown values remain raw.

          ## Pokémon Bank v1.5 full-image support
          - Native recognition for the complete `0xBB518` serialized Pokémon Bank v1.5 image.
          - Accepts `0xBB520` runtime object dumps and normalizes them to the serialized `0xBB518` body.
          - Keeps legacy `0xACA48` Bank containers compatible.
          - No-op full-image load/save remains byte-identical.

          ## Included earlier Bank/BulkStorage improvements
          - BulkStorage containers do not act as an active trainer for handling-trainer name/gender legality comparisons.
          - Ctrl + Shift + click clones the clicked Pokémon to every writable box slot; locked slots are skipped and reported.

          ## Verification
          - Bank v1.5 focused regression tests.
          - BulkStorage trainer-context and clone-all regression tests.
          - Core suite excluding the pre-existing master baseline failure `PKHeX.Core.Tests.Legality.EffortExpLegalityTests.ZeroEVs_ReturnsZero`.
          - Release-mode Win-x64 publish.
          '@
          gh release create $tag $asset --target $env:GITHUB_SHA --title 'PKHeX Bank v1.5 Full Image + Metadata Viewer r2 2026-09-20' --notes $notes
