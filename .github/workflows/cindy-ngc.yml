name: Cindy NGC collection
on:
  push:
    branches: [fix/cindy-ngc-native-gender]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ngc:
    runs-on: windows-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        game: [Colosseum, XD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: 969981/PKHeX-Plugins_CHS
          ref: e2cbf30d025419b384d6453aa294944553b34346
          path: PKHeX-Plugins/PKHeX-Plugins_CHS
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.103'
      - name: Prepare NGC generation
        shell: pwsh
        run: |
          ./tools/CindyDex/prepare.ps1
          Copy-Item tools/CindyDex/NgcDex.cs PKHeX-Plugins/PKHeX-Plugins_CHS/CindyDex.Cli/
      - name: Publish local GCI importer and generator
        shell: pwsh
        run: |
          dotnet publish PKHeX-Plugins/PKHeX-Plugins_CHS/CindyDex.Cli -c Release -r win-x64 --self-contained true -o ngc-tool 2>&1 | Tee-Object build-ngc.log
          exit $LASTEXITCODE
      - name: Generate NGC candidates
        shell: pwsh
        run: |
          ./ngc-tool/CindyDex.Cli.exe ngc output ${{ matrix.game }} 2>&1 | Tee-Object generate-ngc.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cindy-NGC-${{ matrix.game }}-55555-entities
          path: output/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: Cindy-NGC-${{ matrix.game }}-local-GCI-importer
          path: ngc-tool/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cindy-NGC-${{ matrix.game }}-logs
          path: '*-ngc.log'
          if-no-files-found: warn
      - name: Check strict native output and report coverage
        shell: python
        run: |
          import csv,pathlib
          with open('output/manifest.tsv',encoding='utf-8-sig') as f: rows=list(csv.DictReader(f,delimiter='\t'))
          good=[x for x in rows if x['Status']=='OK']
          assert good, 'No own-ID native candidates'
          assert all(x['TID']=='55555' and x['Origin']=='CXD' and x['Gender'] in ('0','1','2') for x in good)
          assert len({(x['Game'],x['Mode'],x['Species'],x['Form'],x['Gender']) for x in good})==len(good)
          assert all((x['Shiny']=='True')==(x['Mode']=='AllShiny') for x in good)
          for mode in ('AllNonShiny','AllShiny'):
              a=[x for x in good if x['Mode']==mode]
              print(mode,'species',len({x['Species'] for x in a}),'entities',len(a),'6V',sum(x['IVTotal']=='186' for x in a))
          for status in ('LOCKED','UNRESOLVED','FIXED_OT_ONLY','FIXED_OT_EXCEPTION'):
              print(status,sum(x['Status']==status for x in rows))
