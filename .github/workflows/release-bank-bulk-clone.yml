name: Verify and Release Bank Bulk Clone

on:
  push:
    branches:
      - feature/bank-bulkstorage-clone-all-boxes

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run feature regression tests
        shell: pwsh
        run: dotnet test Tests/PKHeX.Core.Tests/PKHeX.Core.Tests.csproj -c Release --nologo --filter "FullyQualifiedName~ParseSettingsBulkStorageTests|FullyQualifiedName~BoxCloneUtilTests"

      - name: Run Core tests excluding known master baseline failure
        shell: pwsh
        run: dotnet test Tests/PKHeX.Core.Tests/PKHeX.Core.Tests.csproj -c Release --nologo --filter "FullyQualifiedName!=PKHeX.Core.Tests.Legality.EffortExpLegalityTests.ZeroEVs_ReturnsZero"

      - name: Publish PKHeX Win-x64
        shell: pwsh
        run: dotnet publish PKHeX.WinForms/PKHeX.WinForms.csproj -c Release -r win-x64 -o publish --nologo

      - name: Package release
        if: startsWith(github.event.head_commit.message, 'release:')
        shell: pwsh
        run: |
          $asset = 'PKHeX-Bank-BulkStorage-CloneAll-20261005-win-x64.zip'
          if (Test-Path $asset) { Remove-Item $asset -Force }
          Compress-Archive -Path publish\* -DestinationPath $asset -CompressionLevel Optimal

      - name: Create GitHub Release
        if: startsWith(github.event.head_commit.message, 'release:')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'bank-bulk-clone-20261005'
          $asset = 'PKHeX-Bank-BulkStorage-CloneAll-20261005-win-x64.zip'
          $notes = @'
          ## Changes
          - Synced the fork master with current upstream PKHeX and merged it into the Bank/BulkStorage feature branch.
          - Fixes false handling-trainer legality failures in Pokémon Bank / BulkStorage containers: the placeholder SaveFile trainer name (normally `PKHeX`) is no longer treated as an authoritative active trainer.
          - Recent-handler names such as `Night`, `PKHeX1`, and other legitimate names no longer become illegal merely because they differ from the BulkStorage placeholder trainer.
          - Real game saves still perform normal active-trainer / current-handler legality checks.
          - Keeps Ctrl + Shift + click clone-to-all-boxes behavior and adapts regression coverage to the current Bank7 Transfer Box layout.

          ## Verification
          - Dedicated BulkStorage regression test verifies a legal PK7 with `CurrentHandler = 1` and handling trainer `Night` does not produce `TransferHandlerMismatchName`.
          - Clone-all-boxes regression test passes with the current Bank7 Transfer Box layout.
          - Feature regression tests passed.
          - Core test suite passed with the workflow's existing baseline exclusion.
          - Release-mode Win-x64 publish passed.
          '@
          gh release create $tag $asset --target $env:GITHUB_SHA --title 'PKHeX Bank BulkStorage Clone-All 2026-10-05' --notes $notes
