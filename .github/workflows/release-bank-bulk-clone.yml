name: Verify and Release Bank Bulk Clone

on:
  push:
    branches:
      - feature/bank-bulkstorage-clone-all-boxes

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run feature regression tests
        shell: pwsh
        run: dotnet test Tests/PKHeX.Core.Tests/PKHeX.Core.Tests.csproj -c Release --nologo --filter "FullyQualifiedName~ParseSettingsBulkStorageTests|FullyQualifiedName~BoxCloneUtilTests|FullyQualifiedName~Bank7LegacyCompactTests"

      - name: Run Core tests excluding known master baseline failure
        shell: pwsh
        run: dotnet test Tests/PKHeX.Core.Tests/PKHeX.Core.Tests.csproj -c Release --nologo --filter "FullyQualifiedName!=PKHeX.Core.Tests.Legality.EffortExpLegalityTests.ZeroEVs_ReturnsZero"

      - name: Publish PKHeX Win-x64
        shell: pwsh
        run: dotnet publish PKHeX.WinForms/PKHeX.WinForms.csproj -c Release -r win-x64 -o publish --nologo

      - name: Package release
        if: startsWith(github.event.head_commit.message, 'release:')
        shell: pwsh
        run: |
          $asset = 'PKHeX-Bank-BulkStorage-CloneAll-20261005-r2-win-x64.zip'
          if (Test-Path $asset) { Remove-Item $asset -Force }
          Compress-Archive -Path publish\* -DestinationPath $asset -CompressionLevel Optimal

      - name: Create GitHub Release
        if: startsWith(github.event.head_commit.message, 'release:')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'bank-bulk-clone-20261005-r2'
          $asset = 'PKHeX-Bank-BulkStorage-CloneAll-20261005-r2-win-x64.zip'
          $notes = @'
          ## Changes
          - Includes the 2026-10-05 BulkStorage handling-trainer legality fix.
          - Restores compatibility with legacy compact Pokémon Bank images sized `0xACA48` whose revision field is already Gen7 / revision 2.
          - These compact Gen7 images are preserved at `0xACA48` instead of being rejected or incorrectly forced through the Gen6 upgrade path.
          - Official compact Gen6 / revision 1 Bank images still upgrade to the current full `0xBB518` layout.
          - Real full Gen7 Bank images remain supported unchanged.
          - Keeps Ctrl + Shift + click clone-to-all-boxes behavior.

          ## Verification
          - Added `Bank7LegacyCompactTests` covering both compact Gen7 preservation and compact Gen6 upgrade behavior.
          - Dedicated BulkStorage handling-trainer regression test still passes.
          - Clone-all-boxes regression test passes.
          - Core test suite passed with the workflow's existing baseline exclusion.
          - Release-mode Win-x64 publish passed.
          '@
          gh release create $tag $asset --target $env:GITHUB_SHA --title 'PKHeX Bank BulkStorage Clone-All 2026-10-05 r2' --notes $notes
