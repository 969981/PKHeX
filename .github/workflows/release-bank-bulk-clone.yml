name: Verify and Release Bank Bulk Clone

on:
  push:
    branches:
      - feature/bank-bulkstorage-clone-all-boxes

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run feature regression tests
        shell: pwsh
        run: dotnet test Tests/PKHeX.Core.Tests/PKHeX.Core.Tests.csproj -c Release --nologo --filter "FullyQualifiedName~ParseSettingsBulkStorageTests|FullyQualifiedName~BoxCloneUtilTests"

      - name: Run Core tests excluding known master baseline failure
        shell: pwsh
        run: dotnet test Tests/PKHeX.Core.Tests/PKHeX.Core.Tests.csproj -c Release --nologo --filter "FullyQualifiedName!=PKHeX.Core.Tests.Legality.EffortExpLegalityTests.ZeroEVs_ReturnsZero"

      - name: Publish PKHeX Win-x64
        shell: pwsh
        run: dotnet publish PKHeX.WinForms/PKHeX.WinForms.csproj -c Release -r win-x64 -o publish --nologo

      - name: Package release
        if: startsWith(github.event.head_commit.message, 'release:')
        shell: pwsh
        run: |
          $asset = 'PKHeX-Bank-BulkStorage-CloneAll-20260919-win-x64.zip'
          if (Test-Path $asset) { Remove-Item $asset -Force }
          Compress-Archive -Path publish\* -DestinationPath $asset -CompressionLevel Optimal

      - name: Create GitHub Release
        if: startsWith(github.event.head_commit.message, 'release:')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'bank-bulk-clone-20260919'
          $asset = 'PKHeX-Bank-BulkStorage-CloneAll-20260919-win-x64.zip'
          $notes = @'
          ## Changes
          - Pokémon Bank / BulkStorage containers no longer act as an active trainer for trainer-name/gender legality comparisons, avoiding false trainer-mismatch flags when the container has no trainer identity.
          - Ctrl + Shift + click a populated slot to clone that Pokémon to every writable slot in every box.
          - Overwrite-protected/locked slots are skipped and the skipped count is reported.
          - Existing Ctrl + click, Shift + click, Alt + click, and Ctrl + Alt current-box clone behavior is preserved.

          ## Verification
          - Feature regression tests for BulkStorage trainer context and clone-to-all-boxes behavior.
          - Core test suite excluding the pre-existing master failure PKHeX.Core.Tests.Legality.EffortExpLegalityTests.ZeroEVs_ReturnsZero.
          - Release-mode Win-x64 publish.
          '@
          gh release create $tag $asset --target $env:GITHUB_SHA --title 'PKHeX Bank BulkStorage Clone-All 2026-09-19' --notes $notes
